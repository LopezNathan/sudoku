name: Top up puzzles

on:
  schedule:
    - cron: '0 6 1 * *' # monthly, 1st at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Keep the current month plus 2 more generated; existing months are never overwritten.
      - run: npm run gen -- --months 3
      - name: Commit new puzzles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/puzzles
          if git diff --cached --quiet; then
            echo "Already up to date"
          else
            git commit -m "Add puzzles"
            git push
          fi
